[package]
name = "carta"
description = "Document converter library: parse a source format and render it to a target format."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["markup", "markdown", "document", "converter", "commonmark"]
categories = ["command-line-utilities", "text-processing", "parser-implementations"]
publish.workspace = true
# The golden-snapshot suite (~1 MiB under tests/) is developer-only; keep it out of the published crate.
exclude = ["/tests"]

# docs.rs builds default features only; enable all so every reader/writer is documented.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Points `cargo binstall` at the prebuilt release archives (binary at the archive root).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ bin }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[lints]
workspace = true

[features]
default = ["full", "cli", "fetch"]
# Library users disable defaults; the CLI also needs format features or `full`.
cli = [
    "dep:clap",
    "dep:clap_complete",
    "dep:clap_mangen",
    "carta-readers/yaml",
    "serde_json/arbitrary_precision",
    "standalone",
    "metadata-file",
    "carta-ast/serde",
    "carta-core/serde",
]
# Without `fetch`, remote resources remain external.
fetch = ["dep:ureq"]
full = ["read-commonmark", "read-json", "read-native", "read-html", "read-csv", "read-tsv", "read-opml", "read-rst", "read-ipynb", "read-mediawiki", "read-dokuwiki", "read-jira", "read-man", "read-latex", "read-org", "read-rtf", "read-docx", "read-epub", "read-odt", "read-typst", "read-docbook", "write-html", "write-html4", "write-json", "write-plain", "write-native", "write-latex", "write-commonmark", "write-markdown", "write-gfm", "write-rst", "write-mediawiki", "write-typst", "write-pdf", "write-dokuwiki", "write-jira", "write-asciidoc", "write-man", "write-opml", "write-org", "write-beamer", "write-revealjs", "write-ipynb", "write-epub", "write-docx", "write-odt", "write-rtf", "write-docbook", "highlight", "standalone", "metadata-file"]
# Syntax highlighting and CLI catalog commands.
highlight = ["dep:carta-highlight", "carta-core/highlight", "carta-writers?/highlight"]
# Embeds the copyleft-or-unspecified-license grammar set, which is an explicit choice.
embed-copyleft-grammars = ["highlight", "carta-highlight/embed-copyleft-grammars"]
# Templates and standalone metadata inputs.
standalone = ["carta-core/template", "dep:serde_json"]
# `--metadata-file` parses metadata through the commonmark machinery, so it must pull in that reader.
metadata-file = ["standalone", "read-commonmark"]
read-commonmark = ["dep:carta-readers", "carta-readers/commonmark"]
read-json = ["dep:carta-readers", "carta-readers/json"]
read-native = ["dep:carta-readers", "carta-readers/native"]
read-html = ["dep:carta-readers", "carta-readers/html"]
read-csv = ["dep:carta-readers", "carta-readers/csv"]
read-tsv = ["dep:carta-readers", "carta-readers/tsv"]
read-opml = ["dep:carta-readers", "carta-readers/opml"]
read-rst = ["dep:carta-readers", "carta-readers/rst"]
read-ipynb = ["dep:carta-readers", "carta-readers/ipynb"]
read-mediawiki = ["dep:carta-readers", "carta-readers/mediawiki"]
read-dokuwiki = ["dep:carta-readers", "carta-readers/dokuwiki"]
read-jira = ["dep:carta-readers", "carta-readers/jira"]
read-man = ["dep:carta-readers", "carta-readers/man"]
read-latex = ["dep:carta-readers", "carta-readers/latex"]
read-org = ["dep:carta-readers", "carta-readers/org"]
read-rtf = ["dep:carta-readers", "carta-readers/rtf"]
read-docbook = ["dep:carta-readers", "carta-readers/docbook"]
read-docx = ["dep:carta-readers", "carta-readers/docx"]
read-epub = ["dep:carta-readers", "carta-readers/epub"]
read-odt = ["dep:carta-readers", "carta-readers/odt"]
read-typst = ["dep:carta-readers", "carta-readers/typst"]
write-html = ["dep:carta-writers", "carta-writers/html"]
write-html4 = ["dep:carta-writers", "carta-writers/html"]
write-json = ["dep:carta-writers", "carta-writers/json"]
write-plain = ["dep:carta-writers", "carta-writers/plain"]
write-native = ["dep:carta-writers", "carta-writers/native"]
write-latex = ["dep:carta-writers", "carta-writers/latex"]
write-commonmark = ["dep:carta-writers", "carta-writers/commonmark"]
write-markdown = ["dep:carta-writers", "carta-writers/markdown"]
write-gfm = ["dep:carta-writers", "carta-writers/gfm"]
write-rst = ["dep:carta-writers", "carta-writers/rst"]
write-mediawiki = ["dep:carta-writers", "carta-writers/mediawiki"]
write-pdf = ["write-typst", "standalone", "dep:tempfile"]
write-typst = ["dep:carta-writers", "carta-writers/typst"]
write-dokuwiki = ["dep:carta-writers", "carta-writers/dokuwiki"]
write-jira = ["dep:carta-writers", "carta-writers/jira"]
write-asciidoc = ["dep:carta-writers", "carta-writers/asciidoc"]
write-man = ["dep:carta-writers", "carta-writers/man"]
write-opml = ["dep:carta-writers", "carta-writers/opml"]
write-org = ["dep:carta-writers", "carta-writers/org"]
write-beamer = ["dep:carta-writers", "carta-writers/beamer"]
write-revealjs = ["dep:carta-writers", "carta-writers/revealjs"]
write-ipynb = ["dep:carta-writers", "carta-writers/ipynb"]
write-epub = ["dep:carta-writers", "carta-writers/epub"]
write-docbook = ["dep:carta-writers", "carta-writers/docbook"]
write-docx = ["dep:carta-writers", "carta-writers/docx"]
write-odt = ["dep:carta-writers", "carta-writers/odt"]
write-rtf = ["dep:carta-writers", "carta-writers/rtf"]

[dependencies]
tempfile = { version = "3", optional = true }
carta-ast = { workspace = true }
carta-core = { workspace = true }
carta-highlight = { workspace = true, optional = true }
# Direct paths retain per-crate feature selection; versions support registry publication.
carta-readers = { path = "../carta-readers", version = "0.0.12", default-features = false, optional = true }
carta-writers = { path = "../carta-writers", version = "0.0.12", default-features = false, optional = true }
serde_json = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
clap_complete = { version = "4", optional = true }
clap_mangen = { version = "0.3", optional = true }
# HTTP client behind `fetch`; rustls keeps the build free of a system OpenSSL dependency.
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
# Grow the stack on the same thread because writer options can hold thread-affine state.
stacker = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
criterion = { workspace = true }
serde = { workspace = true }
toml = "1.1"

[[bin]]
name = "carta"
path = "src/main.rs"
required-features = ["cli"]

[[bench]]
name = "convert"
harness = false
