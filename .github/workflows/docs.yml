name: Docs

# The two jobs are coupled: the site reads the JSON docgen generates, so a change to either side
# needs both checked.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'crates/**'
      - 'tools/docgen/**'
      - 'website/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'crates/**'
      - 'tools/docgen/**'
      - 'website/**'
      - '.github/workflows/docs.yml'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  generated:
    name: generated docs are current
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: tools/docgen
      # docgen names the offending file and prints the regeneration command on failure.
      - name: Check generated artifacts against docs/status.toml
        run: cargo run --manifest-path tools/docgen/Cargo.toml -- --check

  site:
    name: website build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Honors the pnpm version pinned by `packageManager` in website/package.json.
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The link validator fails the build, which is what keeps the cross-referenced format pages honest.
      - name: Build
        run: pnpm build
