name: fuzz (nightly discovery)

# Random discovery can fail unrelated PRs; ci.yml replays saved seeds.

on:
  schedule:
    - cron: "17 4 * * *" # off the hour to dodge the scheduler's peak
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds of fuzzing per target (-max_total_time)
        default: "300"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  shard-matrix:
    name: shard targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.chunk.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
      - name: Chunk fuzz targets into shards
        id: chunk
        # Limit each shard to 20 targets to bound run time and share one build.
        run: |
          names=$(grep '^name = ' fuzz/Cargo.toml | grep -v 'carta-fuzz' | cut -d'"' -f2)
          set -- $names
          total=$#
          max_per_shard=20
          shard_count=$(( (total + max_per_shard - 1) / max_per_shard ))
          per_shard=$(( (total + shard_count - 1) / shard_count ))
          json=""
          index=0
          while [ $# -gt 0 ]; do
            chunk=""
            n=0
            while [ $# -gt 0 ] && [ $n -lt $per_shard ]; do
              chunk="$chunk $1"
              shift
              n=$((n + 1))
            done
            json="$json,{\"index\":$index,\"list\":\"${chunk# }\"}"
            index=$((index + 1))
          done
          echo "shards=[${json#,}]" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz shard ${{ matrix.shard.index }}
    needs: shard-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shard-matrix.outputs.shards) }}
    # Headroom for dispatched budgets up to ~900 s/target; beyond that, lower max_per_shard instead.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly toolchain
        run: rustup toolchain install nightly
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-fuzz
      - name: Restore evolved corpus
        uses: actions/cache@v6
        with:
          path: fuzz/corpus
          # Restore other shards too, so moved targets keep their corpus.
          key: fuzz-corpus-shard-${{ matrix.shard.index }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-shard-${{ matrix.shard.index }}-
            fuzz-corpus-shard-
            fuzz-corpus-all-
      - name: Fuzz shard targets
        # Use GNU for sanitizer support; disable allocation stack tracking to prevent false OOMs.
        env:
          ASAN_OPTIONS: malloc_context_size=0
        run: |
          failed=""
          for t in ${{ matrix.shard.list }}; do
            echo "::group::fuzz $t"
            mkdir -p "fuzz/corpus/$t"
            cargo +nightly fuzz run "$t" \
              --target x86_64-unknown-linux-gnu \
              "fuzz/corpus/$t" "fuzz/seeds/$t" \
              -- -max_total_time=${{ github.event.inputs.seconds || '300' }} \
                 -timeout=10 -rss_limit_mb=2048 || failed="$failed $t"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "fuzz findings:$failed" >&2
            exit 1
          fi
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-shard-${{ matrix.shard.index }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
