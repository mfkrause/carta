version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Monthly and grouped: an npm tree on the cargo cadence would swamp the cargo PRs.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    groups:
      website-minor-patch:
        update-types: [minor, patch]
