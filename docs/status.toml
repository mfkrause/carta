[[extensions.gap]]
names = ["raw_tex"]
description = '''A raw-TeX environment (`\begin{…}…\end{…}`) that interrupts an open paragraph with no blank line leaves that paragraph as `Para` rather than tightening it to `Plain`. The free-standing form (a blank line before the environment) is exact.'''

[[extensions.gap]]
names = ["markdown_in_html_blocks"]
description = "A block-level HTML element (`<div>`, `<section>`, `<table>`, …) that interrupts an open paragraph tightens it to `Plain`. Two narrower forms still diverge: a raw-text element (`<pre>`, `<script>`) interrupting a paragraph leaves it as `Para` rather than `Plain`, and an inline-level construct (`<style>`, a comment, a doctype, or a processing instruction) interrupting a paragraph is folded into it as raw inline by the dialect, whereas carta opens a separate raw block."

[[extensions.gap]]
names = ["markdown_in_html_blocks"]
description = "An HTML block left open at end of input (a `<!-- …` comment or a `<table>`/`<div>` with no close tag) is reparsed as ordinary paragraphs by the dialect; carta keeps the whole run as one raw block."

[[extensions.gap]]
names = ["native_spans"]
description = "An emphasis run that opens before a `<span>` and whose closing marker sits just inside the matching `</span>` can leave both tags raw instead of forming a span."

[[extensions.gap]]
names = ["raw_tex"]
description = '''Inline `\command{…}[…]` consumes every group that follows it; commands that take a fixed number of arguments and leave the rest as text are not modeled. A `\begin{env}…\end{env}` is recognized only as a whole paragraph (block level); inline, each `\begin`/`\end` is an ordinary command.'''

[[extensions.gap]]
names = ["citations"]
description = "An abbreviation-led citation suffix such as `p. 5` is a single string in the dialect (a non-breaking space follows the period); carta splits it into separate tokens."

[[extensions.gap]]
names = ["attributes"]
description = "An attribute spec `{…}` containing a backslash escape is void in the dialect (it stays literal text) whereas carta accepts the backslash into the id, class, or value."

[[extensions.gap]]
names = ["alerts"]
description = "An alert marker indented two or more columns inside its blockquote (e.g. `>  [!NOTE]`) is still read as an alert; the dialect treats only a marker at column 0 or 1 as one."

[[feature]]
name = "Standalone output + templates (`-s`, `--template`)"
status = "usable"
notes = "Each writer's scaffold (CSS, preamble) is authored independently and is not byte-identical across tools."

[[feature]]
name = "Table of contents (`--toc`)"
status = "usable"

[[feature]]
name = "Text wrapping (`--wrap`, `--columns`)"
status = "usable"
notes = "A few constructs still account for width incorrectly when reflowed at narrow columns: line blocks, footnote bodies, the AsciiDoc list-marker indent, and roff line-continuation."

[[feature]]
name = "Tab expansion (`--tab-stop`)"
status = "in-development"
notes = "Only the `docbook` reader takes the column width from the option; the `rst`, `dokuwiki`, and `mediawiki` readers expand tabs on a fixed four-column grid."

[[feature]]
name = "Section numbering (`--number-sections`)"
status = "usable"

[[feature]]
name = "Metadata / variables (`-M`, `-V`, `--metadata-file`)"
status = "usable"

[[feature]]
name = "Syntax highlighting"
status = "usable"
notes = "Language classes resolve as written (no alias canonicalization), so a mixed-case spelling of an alias may color differently from its lowercase form."

[[feature]]
name = "Citations / citeproc (`--citeproc`)"
status = "not-started"
notes = "`Cite` carried in the AST, not processed."

[[feature]]
name = "Filters (JSON)"
status = "usable"

[[feature]]
name = "Filters (Lua)"
status = "not-started"

[[feature]]
name = "Data directory (`--data-dir`)"
status = "usable"

[[feature]]
name = "Math output methods (MathJax, KaTeX; MathML, webtex, plain HTML)"
status = "in-development"
notes = "With no method given, HTML math keeps the verbatim TeX in a math span rather than rendering to plain HTML; no webtex or default plain-HTML renderer yet."

[[feature]]
name = "Writer extension toggles"
status = "usable"
notes = "`rst` does not yet backslash-escape literal ASCII `--`/`...` under the non-default `+smart`."

[[feature]]
name = "Embed resources / extract media"
status = "usable"

[[feature]]
name = "Filename format inference"
status = "usable"

[[feature]]
name = "Multiple inputs / defaults files (`--defaults`)"
status = "in-development"
notes = "Multiple binary inputs, `--file-scope`, and defaults files are not supported."

[[feature]]
name = "CLI introspection (`--list-input-formats`, `--list-extensions`, …)"
status = "usable"
