read-feature = "read-rtf"
write-feature = "write-rtf"
read-gaps = [
  '''A `\mac`, `\pc`, or `\pca` document's `\'xx` bytes decode as Windows-1252 rather than the declared character set.''',
  '''A control byte delivered through a `\'xx` or `\uN` escape (tab, line feed) is kept as a literal character rather than normalized to a space or line break.''',
  '''`\softline` renders as a hard line break rather than being dropped.''',
  '''Formatting inside an `\info` field is flattened to plain text, and `\generator` is not captured as document metadata.''',
]
write-gaps = [
  '''A table nested inside another table's cell carries a single `\intbl` on its cell paragraphs regardless of nesting depth, so the inner table is not set off from its container.''',
  "A nested ordered list with default style is numbered with decimal markers at every level rather than cycling the marker style by depth.",
]

