[[format]]
name = "latex"
title = "LaTeX"
family = "tex"
read = "usable"
write = "usable"
read-feature = "read-latex"
write-feature = "write-latex"
read-gaps = [
  '''Only the `\begin{document}`…`\end{document}` body is rendered; the preamble contributes metadata (`\title`, `\author`, `\date`, `\subtitle`, `abstract`) and macro definitions but is otherwise dropped. A file with no `document` environment is read whole. `\institute` is dropped entirely.''',
  "With `raw_tex` off (the default), an unknown command is dropped together with its bracket and brace arguments and an unknown environment becomes a classed `Div`; under `raw_tex` both are preserved verbatim as raw LaTeX.",
  '''Macro expansion (`\newcommand`, `\renewcommand`, `\providecommand`, `\DeclareRobustCommand`, `\def`, `\let`) handles numbered parameters and one optional-argument default and is bounded to a fixed nesting depth; delimited parameters, `\csname`/`\expandafter`, catcode changes, and recursive or multi-optional macros are unsupported. With `latex_macros` off, each definition is left verbatim as a raw block.''',
  '''Cross-reference commands (`\ref`, `\eqref`, `\autoref`, `\cref`, `\pageref`) resolve to a link whose visible text is a bracketed `[label]` placeholder rather than the target's counter number.''',
  '''Multi-line math environments (`align`, `gather`, `multline`, `eqnarray`, `alignat`, `flalign`, …) are kept as a single display-math inline holding the whole `\begin…\end` text rather than split into rows and cells.''',
  '''`\includegraphics` keeps only `width` and `height`; `\textwidth`/`\linewidth`/`\textheight` lengths convert to percentages and absolute units pass through, but `\columnwidth`/`\paperwidth` and leading-dot decimal values are omitted.''',
  '''Table support covers header detection, per-column alignment, and `\multicolumn` colspan; `\multirow`, partial `\cline` rules, nested tables, and `\caption` placement may flatten or drop.''',
  '''`\raisebox` in its optional depth/height form drops the box content; purely visual commands (font-size macros, `\bfseries` scoping, spacing macros) drop styling and keep only the inner content.''',
]
write-gaps = [
  '''In a line block, a line whose content is entirely code spans is set without the trailing `\strut` that keeps its full height, and a space ending a line is dropped.''',
]

