[package]
name = "docgen"
version = "0.0.0"
edition = "2024"
publish = false

# Keep docgen outside workspace coverage, dependency, and feature checks.
[workspace]

[dependencies]
carta = { path = "../../crates/carta", default-features = false, features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
